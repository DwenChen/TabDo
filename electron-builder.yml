appId: io.github.dwenchen.tabdo
productName: TabDo
publish:
  provider: github
  owner: DwenChen
  repo: TabDo
directories:
  buildResources: build
files:
  - '!{.local/**,.artifacts/**,test-results/**,playwright-report/**,_*,_*/**}'
  - '!{Preview.cmd,PreviewPortable.cmd,README_CN.md,playwright.e2e.config.ts,pnpm-workspace.yaml}'
  - '!**/.vscode/*'
  - '!**/.DS_Store'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!{CHANGELOG.md,changelog.md,README.md,README_EN.md,CONTRIBUTING.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,.gitmodules,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo,vitest.config.*}'
  - '!{.claude/**,.githooks/**,.github/**}'
  - '!AGENTS.md'
  - '!docs/**'
  - '!tests/**'
  - '!updater/**'
  - '!scripts/**'
  - '!internal-plugins/**'
  - '!**/*.map'
  - '!**/node_modules/**/*.{d.ts,d.cts,d.mts}'
  - '!**/node_modules/openai/src/**'
  - '!**/node_modules/@mixmark-io/domino/.yarn/**'
  - '!**/node_modules/lmdb/{dependencies,src}/**'
  - '!**/node_modules/uiohook-napi/{libuiohook,src}/**'
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/ffmpeg-static/**/*'
  - '**/node_modules/ffprobe-static/**/*'
fileAssociations:
  - ext: zpx
    name: TabDo Plugin
    description: TabDo Plugin Package
    role: Viewer
win:
  compression: normal
  executableName: TabDo
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  # 保留既有安装记录身份，更名后仍升级同一安装。
  guid: 16cce2fb-e210-5495-95a1-e6cbd75b10f6
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  compression: maximum
  # The Developer ID identity is selected by CSC_NAME in CI. Leaving this
  # unset keeps local builds compatible with machines that have no certificate.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  identity: null
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false

afterPack: ./build/afterPack.js
