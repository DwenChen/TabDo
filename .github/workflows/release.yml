name: Release local edition
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            internal-plugins/setting/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir internal-plugins/setting install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:setting
      - run: pnpm test
      - name: Build and package in cloud
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve release version
        id: version
        run: |
          node -e "const fs=require('fs'); const version=require('./package.json').version; const tag='v'+version; if(process.env.GITHUB_EVENT_NAME==='push' && process.env.GITHUB_REF_NAME!==tag) throw Error('Tag must match package version'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+version+'\ntag='+tag+'\n');"
      - name: Prepare Windows updater metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_UPDATE_METADATA: artifacts/win-x64/latest.yml
          UPDATE_METADATA_OUTPUT_DIR: artifacts/metadata
          REQUIRE_UPDATE_METADATA: 'true'
        run: node scripts/updater.mjs
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZTools 本地版 ${{ steps.version.outputs.tag }}
          body_path: changelog.md
          make_latest: true
          files: |
            artifacts/win-x64/*.exe
            artifacts/win-x64/*.zip
            artifacts/win-x64/*.blockmap
            artifacts/metadata/*.yml
