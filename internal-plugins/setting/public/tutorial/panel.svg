<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">内容决定匹配操作</title><desc id="desc">文本编辑器，选中一段测试文字，必要时 Ctrl+C，确认复制成功；按配置鼠标键，触发键与按住时间，以通用设置为准，有效时间内触发；匹配结果，文字 → 文本操作，图片 → 图片处理，文件 → 重命名</desc><rect width="760" height="340" rx="12" fill="#f4f7f6"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#193e30"><text x="24" y="37" font-size="19" font-weight="600">内容决定匹配操作</text><text x="736" y="37" text-anchor="end" font-size="12" fill="#5b776b">TabDo · 操作示意</text><g transform="translate(24,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">文本编辑器</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">选中一段测试文字</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">必要时 Ctrl+C</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">确认复制成功</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">1</text></g><path d="M249 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(270,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">按配置鼠标键</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">触发键与按住时间</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">以通用设置为准</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">有效时间内触发</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">2</text></g><path d="M495 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(516,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">匹配结果</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">文字 → 文本操作</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">图片 → 图片处理</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">文件 → 重命名</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">3</text></g><text x="24" y="322" font-size="12" fill="#5b776b">按 ① → ② → ③ 操作；具体控件和默认值以当前应用设置为准。</text></g></svg>
