<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">让资料始终可找回</title><desc id="desc">导出完整备份，数据页面选择导出，等待成功提示，确认备份文件存在；退出后迁移，选择新资料目录，逐文件复制校验，原始资料继续保留；重启后核对，设置 / 快捷键，历史 / 收藏 / 插件，确认齐全再使用</desc><rect width="760" height="340" rx="12" fill="#f4f7f6"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#193e30"><text x="24" y="37" font-size="19" font-weight="600">让资料始终可找回</text><text x="736" y="37" text-anchor="end" font-size="12" fill="#5b776b">TabDo · 操作示意</text><g transform="translate(24,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">导出完整备份</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">数据页面选择导出</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">等待成功提示</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">确认备份文件存在</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">1</text></g><path d="M249 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(270,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">退出后迁移</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">选择新资料目录</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">逐文件复制校验</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">原始资料继续保留</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">2</text></g><path d="M495 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(516,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">重启后核对</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">设置 / 快捷键</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">历史 / 收藏 / 插件</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">确认齐全再使用</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">3</text></g><text x="24" y="322" font-size="12" fill="#5b776b">按 ① → ② → ③ 操作；具体控件和默认值以当前应用设置为准。</text></g></svg>
