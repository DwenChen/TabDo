<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">按需要启用快捷入口</title><desc id="desc">设置 → 快捷键，首次全部关闭，启用一项所需操作，录制无冲突组合；插件市场，阅读详情与来源，或导入本地安装包，确认名称和版本；已安装插件，打开并验证功能，退出释放临时资源，卸载前备份资料</desc><rect width="760" height="340" rx="12" fill="#f4f7f6"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#193e30"><text x="24" y="37" font-size="19" font-weight="600">按需要启用快捷入口</text><text x="736" y="37" text-anchor="end" font-size="12" fill="#5b776b">TabDo · 操作示意</text><g transform="translate(24,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">设置 → 快捷键</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">首次全部关闭</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">启用一项所需操作</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">录制无冲突组合</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">1</text></g><path d="M249 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(270,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">插件市场</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">阅读详情与来源</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">或导入本地安装包</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">确认名称和版本</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">2</text></g><path d="M495 183h16m-5-5 5 5-5 5" fill="none" stroke="#059669" stroke-width="2"/><g transform="translate(516,78)"><rect width="220" height="216" rx="12" fill="#fff" stroke="#c9d9d2"/><path d="M0 38H220" stroke="#dce6e1"/><circle cx="20" cy="19" r="4" fill="#059669"/><text x="34" y="24" font-size="13" font-weight="600">已安装插件</text><rect x="14" y="52" width="192" height="36" rx="5" fill="#e5f5ec"/><text x="24" y="75" font-size="13">打开并验证功能</text><rect x="14" y="99" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="122" font-size="13">退出释放临时资源</text><rect x="14" y="146" width="192" height="36" rx="5" fill="#f4f7f6"/><text x="24" y="169" font-size="13">卸载前备份资料</text><circle cx="196" cy="196" r="12" fill="#059669"/><text x="196" y="201" text-anchor="middle" fill="white" font-size="13">3</text></g><text x="24" y="322" font-size="12" fill="#5b776b">按 ① → ② → ③ 操作；具体控件和默认值以当前应用设置为准。</text></g></svg>
