<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>录屏控制条</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: #202623;
        font:
          13px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      main {
        height: 66px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8faf9;
        border: 1px solid #d6e1db;
        border-radius: 12px;
        -webkit-app-region: drag;
      }
      i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ef4444;
      }
      section {
        flex: 1;
      }
      small {
        display: block;
        color: #6b7770;
        font-size: 11px;
      }
      button {
        font: inherit;
        color: white;
        background: #059669;
        border: 0;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:disabled {
        opacity: 0.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e7eee9;
        }
        main {
          background: #222a26;
          border-color: #46534b;
        }
        small {
          color: #a9b7ad;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <i></i>
      <section><strong id="status">准备录制</strong><small id="detail">停止并保存</small></section>
      <button id="stop">停止</button>
    </main>
    <script src="recorder-control.js"></script>
  </body>
</html>
